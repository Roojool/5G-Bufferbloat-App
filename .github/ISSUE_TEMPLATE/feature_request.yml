name: Feature request
description: Propose a focused improvement that fits the project's local-only, privacy-first scope.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user problem rather than only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Explain how it would work and why it fits the local-only design.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include the reason existing Android/platform behavior is insufficient.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This proposal does not require a project-operated relay, telemetry backend, TLS interception, or traffic-data resale.
          required: true
        - label: I have read the project's documented limitations and compatibility goals.
          required: true
