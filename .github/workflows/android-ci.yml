name: Android CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build, unit test, and lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK, NDK, and CMake
        uses: android-actions/setup-android@v3

      - name: Install native build dependencies
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" \
            "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Assemble, test, and lint
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleRelease

      - name: Verify selected NDK, internal packaging, and host tools
        run: |
          python3 tools/verify_harness_build.py
          python3 -m unittest discover -s tools -p 'test_*.py' -v

      # `assembleDebug` packages the safe native stub for the configured
      # arm64-v8a/armeabi-v7a/x86_64 targets. `assembleDebugAndroidTest`
      # compile-checks native safe-fallback instrumentation tests. Real-engine
      # traffic smoke tests remain blocked until a reviewed gVisor/tun2socks
      # adapter is integrated and an emulator/device matrix is available.
